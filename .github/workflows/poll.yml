name: 버튼 응답

# 버튼을 눌렀을 때 답해 주는 일만 합니다.
#
# 텔레그램은 "누가 버튼을 눌렀다"를 봇이 직접 물어보러 올 때만 알려주고,
# 확인하지 않은 클릭을 24시간 보관합니다. 그래서 10분마다 물어보기만 하면
# 클릭이 사라지지 않고 최대 10분 늦게 처리됩니다.
#
# 공개 저장소는 Actions 사용 시간이 무제한이라 이 간격이 공짜입니다.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: read            # 여기서는 저장소에 쓰지 않습니다

concurrency:
  group: poll
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      TZ: Asia/Seoul
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PYTHONIOENCODING: utf-8

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # '어디까지 읽었는지'를 실행 사이에 기억합니다. 이게 없으면 매번 같은
      # 클릭에 다시 답해서 같은 메시지가 반복해서 옵니다.
      # 커밋하지 않고 캐시를 쓰는 이유: 10분마다 커밋하면 하루 144개가 쌓입니다.
      - name: 읽은 위치 불러오기
        uses: actions/cache@v4
        with:
          path: work/bot_offset.txt
          key: bot-offset-${{ github.run_id }}
          restore-keys: bot-offset-

      - name: 시크릿 공백 제거
        run: |
          for v in TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID; do
            raw="${!v}"
            clean=$(printf '%s' "$raw" | tr -d '[:space:]')
            echo "::add-mask::$clean"
            echo "$v=$clean" >> "$GITHUB_ENV"
          done

      - name: 밀린 클릭 처리
        run: python bot_server.py --once
